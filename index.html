```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusFlow | Student Management</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');

*{box-sizing:border-box}

body{
    margin:0;
    background:#f5f7fb;
    color:#172033;
    font-family:'DM Sans',sans-serif
}

button,input,select{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}

.muted{color:#8992a5}
.tiny{font-size:12px;color:#8992a5}

/* AUTH */

.auth-wrap{
    min-height:100vh;
    display:grid;
    place-items:center;
    background:linear-gradient(130deg,#eef3ff,#f7f9fc)
}

.auth-card{
    background:white;
    width:min(440px,92vw);
    padding:38px;
    border-radius:20px;
    box-shadow:0 25px 80px #293c6718
}

.brand{
    display:flex;
    gap:12px;
    align-items:center;
    margin-bottom:30px
}

.brand b{
    font-family:Manrope;
    font-size:19px
}

.brand small{
    display:block;
    font-size:12px;
    margin-top:3px;
    color:#8992a5
}

.logo{
    width:42px;
    height:42px;
    background:#5546d7;
    color:white;
    border-radius:13px;
    display:grid;
    place-items:center;
    font-size:22px
}

.auth-card h1{
    font:800 28px Manrope;
    margin-bottom:6px
}

label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin:18px 0
}

input,select{
    width:100%;
    padding:12px 14px;
    border:1px solid #e2e6ef;
    border-radius:10px;
    margin-top:8px;
    outline:none;
    background:white;
    color:#172033
}

input:focus,select:focus{
    border-color:#6455df;
    box-shadow:0 0 0 3px #6455df16
}

.primary{
    background:#5546d7;
    color:white;
    border-radius:10px;
    padding:12px 16px;
    font-weight:700
}

.primary:hover{background:#4434c1}
.full{width:100%;margin-top:8px}

.switch{
    text-align:center;
    font-size:14px;
    margin:22px 0
}

.switch a{
    color:#5546d7;
    font-weight:700;
    cursor:pointer
}

/* SIDEBAR */

.sidebar{
    width:245px;
    background:white;
    border-right:1px solid #e9edf4;
    position:fixed;
    inset:0;
    padding:26px 16px;
    display:flex;
    flex-direction:column
}

.navlabel{
    font-size:10px;
    letter-spacing:1.4px;
    color:#a1a9b9;
    margin:22px 12px 10px
}

.nav{
    width:100%;
    display:flex;
    align-items:center;
    gap:13px;
    padding:13px 14px;
    border-radius:10px;
    background:white;
    color:#6f7890;
    text-align:left;
    margin:3px 0;
    font-weight:600
}

.nav.active,.nav:hover{
    background:#f0efff;
    color:#5546d7
}

.nav span{font-size:14px}

.sidebar-bottom{margin-top:auto}

.profile{
    display:flex;
    align-items:center;
    gap:10px;
    border-top:1px solid #edf0f5;
    padding:18px 6px
}

.profile small{
    display:block;
    font-size:12px;
    margin-top:3px;
    color:#8992a5
}

.avatar{
    width:38px;
    height:38px;
    border-radius:12px;
    background:#e6e4ff;
    color:#5546d7;
    display:grid;
    place-items:center;
    font-weight:800
}

/* MAIN */

.main{
    margin-left:245px;
    padding:32px 38px;
    max-width:1500px
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px
}

header h1{
    font:800 28px Manrope;
    margin:3px 0
}

header p{margin:0;font-size:12px}

.header-right{
    display:flex;
    gap:12px;
    align-items:center
}

.search{width:230px;margin:0}

/* CARDS */

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:17px;
    margin-bottom:24px
}

.card{
    background:white;
    border:1px solid #edf0f5;
    border-radius:16px;
    padding:21px
}

.stat-label{font-size:13px;color:#7f899d}
.stat{font:800 29px Manrope;margin:13px 0 6px}
.stat-note{font-size:12px;color:#8a94a8}

/* SECTION */

.section{
    background:white;
    border:1px solid #edf0f5;
    border-radius:16px;
    padding:22px;
    margin:18px 0
}

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px
}

.section-head h2{
    font:700 17px Manrope;
    margin:0
}

/* TABLE */

.table-wrap{overflow:auto}

table{
    width:100%;
    border-collapse:collapse;
    min-width:720px
}

th{
    text-align:left;
    color:#8992a5;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.6px;
    padding:12px;
    border-bottom:1px solid #eef0f5
}

td{
    padding:14px 12px;
    border-bottom:1px solid #f1f3f7;
    font-size:13px
}

tr:last-child td{border:0}

.student-cell{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:600
}

.mini-avatar{
    width:35px;
    height:35px;
    border-radius:11px;
    background:#edf0ff;
    color:#5546d7;
    display:grid;
    place-items:center;
    font-weight:700
}

.badge{
    border-radius:30px;
    padding:5px 10px;
    font-size:11px;
    font-weight:700;
    background:#e8f7ef;
    color:#24865b
}

.badge.leave{
    background:#fff3e5;
    color:#b77824
}

.badge.graduated{
    background:#eff1f5;
    color:#687186
}

.actions-cell button{
    padding:7px 9px;
    border-radius:8px;
    background:#f3f4f9;
    margin-right:4px;
    color:#606b81
}

.actions-cell button.delete{color:#d34e55}

.empty{
    text-align:center;
    padding:40px;
    color:#8992a5
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:#141b2c77;
    display:grid;
    place-items:center;
    padding:20px;
    z-index:5
}

.modal-card{
    background:white;
    width:min(700px,100%);
    padding:25px;
    border-radius:18px;
    max-height:90vh;
    overflow:auto
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center
}

.modal-head h2{font:800 20px Manrope}

.icon{
    background:#f1f3f7;
    border-radius:8px;
    padding:7px 11px;
    font-size:20px
}

.grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 20px
}

.actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px
}

.secondary{
    background:#f1f3f7;
    padding:12px 16px;
    border-radius:10px
}

/* REPORTS */

.report-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px
}

.report-card{
    padding:22px;
    border:1px solid #edf0f5;
    border-radius:15px
}

.report-card h3{font-size:14px}
.report-card strong{font:800 28px Manrope}

.filters{
    display:flex;
    gap:10px;
    margin-bottom:15px
}

.filters select{width:auto;margin:0}

.notice{
    padding:12px;
    border-radius:10px;
    background:#eef4ff;
    color:#52649b;
    font-size:13px
}

/* RESPONSIVE */

@media(max-width:950px){

    .sidebar{
        width:75px;
        padding:20px 10px
    }

    .sidebar .brand div:not(.logo),
    .navlabel,
    .nav span,
    .profile div:not(.avatar){
        display:none
    }

    .nav{justify-content:center}

    .main{
        margin-left:75px;
        padding:24px
    }

    .cards{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:600px){

    .main{padding:15px}

    header{
        align-items:flex-start;
        gap:15px;
        flex-direction:column
    }

    .header-right{width:100%}

    .search{
        flex:1;
        width:auto
    }

    .cards{grid-template-columns:1fr 1fr}

    .grid2{grid-template-columns:1fr}

    .report-grid{grid-template-columns:1fr}

    .sidebar{width:60px}

    .main{margin-left:60px}

    .auth-card{padding:25px}
}

</style>
</head>

<body>

<!-- LOGIN & SIGNUP -->

<div id="authView" class="auth-wrap">

<div class="auth-card">

<div class="brand">
<div class="logo">✦</div>

<div>
<b>CampusFlow</b>
<small>Student administration</small>
</div>
</div>

<h1 id="authTitle">Welcome back</h1>

<p class="muted">Manage your campus, beautifully.</p>

<form id="authForm">

<label id="nameLabel" class="hidden">
Full name
<input id="name" placeholder="Your name">
</label>

<label>
Email address
<input id="email" type="email" required placeholder="admin@campus.edu">
</label>

<label>
Password
<input id="password" type="password" required minlength="4" placeholder="Password">
</label>

<button class="primary full" id="authSubmit">
Sign in
</button>

</form>

<p class="switch">
<span id="switchText">New to CampusFlow?</span>
<a id="switchAuth">Create account</a>
</p>

<p class="tiny">Register an account to begin.</p>

</div>
</div>


<!-- APPLICATION -->

<div id="appView" class="app hidden">

<aside class="sidebar">

<div class="brand">
<div class="logo">✦</div>

<div>
<b>CampusFlow</b>
<small>Administration</small>
</div>
</div>

<div class="navlabel">WORKSPACE</div>

<button class="nav active" data-page="dashboard">
▦ <span>Overview</span>
</button>

<button class="nav" data-page="students">
♙ <span>Students</span>
</button>

<button class="nav" data-page="courses">
▤ <span>Courses</span>
</button>

<button class="nav" data-page="attendance">
◷ <span>Attendance</span>
</button>

<button class="nav" data-page="reports">
▧ <span>Reports</span>
</button>

<div class="sidebar-bottom">

<div class="profile">

<div class="avatar">CF</div>

<div>
<b id="userName">Admin</b>
<small>Administrator</small>
</div>

</div>

<button id="logout" class="nav">
↪ <span>Sign out</span>
</button>

</div>

</aside>


<main class="main">

<header>

<div>
<p class="muted" id="dateText"></p>
<h1 id="pageTitle">Overview</h1>
</div>

<div class="header-right">

<input
id="globalSearch"
placeholder="⌕ Search students..."
class="search">

<button class="primary" id="quickAdd">
＋ Add student
</button>

</div>

</header>

<div id="pageContent"></div>

</main>

</div>


<!-- STUDENT MODAL -->

<div id="modal" class="modal hidden">

<div class="modal-card">

<div class="modal-head">

<h2 id="modalTitle">Add student</h2>

<button id="closeModal" class="icon">×</button>

</div>

<form id="studentForm">

<input id="studentId" type="hidden">

<div class="grid2">

<label>
Full name
<input id="sName" required placeholder="Student name">
</label>

<label>
Student ID
<input id="sId" required placeholder="STU-2026-001">
</label>

<label>
Email
<input id="sEmail" type="email" required>
</label>

<label>
Department

<select id="sDept">
<option>Computer Science</option>
<option>Information Technology</option>
<option>Electrical Engineering</option>
<option>Mechanical Engineering</option>
<option>Business Administration</option>
<option>Arts & Humanities</option>
</select>

</label>

<label>
Year

<select id="sYear">
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>
</select>

</label>

<label>
Status

<select id="sStatus">
<option>Active</option>
<option>On Leave</option>
<option>Graduated</option>
</select>

</label>

<label>
Phone
<input id="sPhone" placeholder="+91 00000 00000">
</label>

<label>
GPA
<input id="sGpa" type="number" min="0" max="10" step=".1" placeholder="8.5">
</label>

</div>

<div class="actions">

<button type="button" class="secondary" id="cancelModal">
Cancel
</button>

<button class="primary">
Save student
</button>

</div>

</form>
</div>
</div>


<script>

/* =========================
   DATA
========================= */

const $ = id => document.getElementById(id);

let mode = 'login';
let page = 'dashboard';

let users = JSON.parse(localStorage.users || '[]');

let students = JSON.parse(localStorage.students || '[]');

let current = localStorage.currentUser || '';

const initials = name =>
name.split(' ')
.map(x => x[0])
.slice(0,2)
.join('')
.toUpperCase();


function save(){
localStorage.students = JSON.stringify(students);
}


/* =========================
   AUTHENTICATION
========================= */

function auth(){

if(current){
showApp();
}

else{

$('authView').classList.remove('hidden');
$('appView').classList.add('hidden');

}

}


function showApp(){

$('authView').classList.add('hidden');
$('appView').classList.remove('hidden');

$('userName').textContent = current;

$('dateText').textContent =
new Date().toLocaleDateString(undefined,{
weekday:'long',
year:'numeric',
month:'long',
day:'numeric'
});

render();

}


/* SIGNUP / LOGIN SWITCH */

$('switchAuth').onclick = ()=>{

mode = mode === 'login' ? 'signup' : 'login';

$('authTitle').textContent =
mode === 'login'
? 'Welcome back'
: 'Create your account';

$('nameLabel').classList.toggle(
'hidden',
mode === 'login'
);

$('switchText').textContent =
mode === 'login'
? 'New to CampusFlow?'
: 'Already registered?';

$('switchAuth').textContent =
mode === 'login'
? 'Create account'
: 'Sign in';

$('authSubmit').textContent =
mode === 'login'
? 'Sign in'
: 'Create account';

};


/* AUTH FORM */

$('authForm').onsubmit = e=>{

e.preventDefault();

let email = $('email').value.toLowerCase();

let pass = $('password').value;


if(mode === 'signup'){

if(users.some(u=>u.email===email)){

alert('Account already exists.');

return;

}

users.push({

email,
pass,

name:$('name').value.trim() || email.split('@')[0]

});

localStorage.users = JSON.stringify(users);

current = users.at(-1).name;

}


else{

let user = users.find(
u=>u.email===email && u.pass===pass
);

if(!user){

alert('Invalid email or password. Create an account first.');

return;

}

current = user.name;

}


localStorage.currentUser = current;

showApp();

};


/* LOGOUT */

$('logout').onclick = ()=>{

current='';

localStorage.removeItem('currentUser');

auth();

};


/* NAVIGATION */

document.querySelectorAll('.nav[data-page]')
.forEach(button=>{

button.onclick=()=>{

page=button.dataset.page;

document.querySelectorAll('.nav[data-page]')
.forEach(x=>x.classList.remove('active'));

button.classList.add('active');

render();

};

});


/* =========================
   STUDENT MODAL
========================= */

$('quickAdd').onclick=()=>openModal();

$('closeModal').onclick=
$('cancelModal').onclick=closeModal;


function closeModal(){

$('modal').classList.add('hidden');

}


function openModal(student){

$('modal').classList.remove('hidden');

$('studentForm').reset();

$('studentId').value=student?.id||'';

$('modalTitle').textContent=
student?'Edit student':'Add student';


if(student){

$('sName').value=student.name;
$('sId').value=student.sid;
$('sEmail').value=student.email;
$('sDept').value=student.dept;
$('sYear').value=student.year;
$('sStatus').value=student.status;
$('sPhone').value=student.phone||'';
$('sGpa').value=student.gpa||'';

}

}


/* SAVE STUDENT */

$('studentForm').onsubmit=e=>{

e.preventDefault();

let id=$('studentId').value;


let student={

id:id||crypto.randomUUID(),

name:$('sName').value.trim(),

sid:$('sId').value.trim(),

email:$('sEmail').value.trim(),

dept:$('sDept').value,

year:$('sYear').value,

status:$('sStatus').value,

phone:$('sPhone').value,

gpa:$('sGpa').value

};


if(students.some(s=>s.sid===student.sid&&s.id!==id)){

alert('Student ID already exists.');

return;

}


if(id){

students=students.map(
s=>s.id===id?student:s
);

}

else{

students.unshift(student);

}


save();

closeModal();

render();

};


/* =========================
   RENDER PAGES
========================= */

function render(){

let content=$('pageContent');

$('pageTitle').textContent={

dashboard:'Overview',
students:'Students',
courses:'Courses',
attendance:'Attendance',
reports:'Reports'

}[page];


if(page==='dashboard'){

let active=students.filter(
s=>s.status==='Active'
).length;


let gpaStudents=students.filter(
s=>s.gpa!==''&&s.gpa!=null
);


let avgGpa=gpaStudents.length?

(
gpaStudents.reduce(
(sum,s)=>sum+Number(s.gpa),
0
)/gpaStudents.length
).toFixed(2)

:'—';


content.innerHTML=`

<div class="cards">

<div class="card">
<div class="stat-label">Total students</div>
<div class="stat">${students.length}</div>
<div class="stat-note">Registered records</div>
</div>

<div class="card">
<div class="stat-label">Active students</div>
<div class="stat">${active}</div>
<div class="stat-note">Currently enrolled</div>
</div>

<div class="card">
<div class="stat-label">Departments</div>
<div class="stat">${new Set(students.map(s=>s.dept)).size}</div>
<div class="stat-note">Represented departments</div>
</div>

<div class="card">
<div class="stat-label">Average GPA</div>
<div class="stat">${avgGpa}</div>
<div class="stat-note">Out of 10.0</div>
</div>

</div>

<div class="section">

<div class="section-head">

<h2>Recently added students</h2>

<button class="secondary"
onclick="page='students';render()">
View all
</button>

</div>

${table(students.slice(0,5))}

</div>

<div class="notice">
Welcome to CampusFlow. Add records, edit details,
search students, and export reports.
</div>

`;

}


/* STUDENTS */

else if(page==='students'){

content.innerHTML=`

<div class="section">

<div class="section-head">

<h2>Student directory</h2>

<button class="primary"
onclick="openModal()">
＋ Add student
</button>

</div>

<div class="filters">

<select id="deptFilter">

<option value="">All departments</option>

${[...new Set(students.map(s=>s.dept))]
.map(d=>`<option>${esc(d)}</option>`)
.join('')}

</select>


<select id="statusFilter">

<option value="">All statuses</option>
<option>Active</option>
<option>On Leave</option>
<option>Graduated</option>

</select>

</div>

<div id="studentTable">
${table(students)}
</div>

</div>

`;


$('deptFilter').onchange=
$('statusFilter').onchange=filterStudents;

}


/* COURSES */

else if(page==='courses'){

content.innerHTML=`

<div class="section">

<h2>Course overview</h2>

<p class="muted">
Department-wise student enrolment
</p>

${[...new Set(students.map(s=>s.dept))]
.map(d=>`

<div class="report-card" style="margin:10px 0">

<h3>${esc(d)}</h3>

<strong>
${students.filter(s=>s.dept===d).length}
</strong>

<span class="muted">students</span>

</div>

`).join('')

||'<div class="empty">Add students to see department statistics.</div>'}

</div>

`;

}


/* ATTENDANCE */

else if(page==='attendance'){

content.innerHTML=`

<div class="section">

<h2>Attendance module</h2>

<p class="muted">
Attendance management is reserved for the next module.
This prototype currently provides student registration
and administration.
</p>

<div class="notice">
Attendance can be expanded with date-wise attendance,
course rosters and attendance percentage calculation.
</div>

</div>

`;

}


/* REPORTS */

else{

content.innerHTML=`

<div class="section">

<div class="section-head">

<h2>Reports</h2>

<button class="primary"
onclick="exportCSV()">
↓ Export CSV
</button>

</div>

<div class="report-grid">

<div class="report-card">

<h3>Total students</h3>

<strong>${students.length}</strong>

</div>

<div class="report-card">

<h3>Active</h3>

<strong>
${students.filter(s=>s.status==='Active').length}
</strong>

</div>

<div class="report-card">

<h3>Graduated</h3>

<strong>
${students.filter(s=>s.status==='Graduated').length}
</strong>

</div>

</div>


<h3 style="margin-top:25px">
Department breakdown
</h3>


${[...new Set(students.map(s=>s.dept))]
.map(d=>`

<div style="padding:10px 0;border-bottom:1px solid #eee">

${esc(d)}

<b style="float:right">

${students.filter(s=>s.dept===d).length}

</b>

</div>

`).join('')

||'<div class="empty">No data yet.</div>'}

</div>

`;

}

}


/* =========================
   SEARCH
========================= */

function renderStudents(query=''){

let list=students.filter(s=>

(s.name+s.sid+s.email+s.dept)
.toLowerCase()
.includes(query.toLowerCase())

);

$('studentTable').innerHTML=table(list);

}


$('globalSearch').oninput=()=>{

if(page!=='students'){

page='students';

document.querySelectorAll('.nav[data-page]')
.forEach(x=>x.classList.remove('active'));

document.querySelector('[data-page="students"]')
.classList.add('active');

render();

}

renderStudents($('globalSearch').value);

};


/* FILTER */

function filterStudents(){

let d=$('deptFilter').value;

let st=$('statusFilter').value;


$('studentTable').innerHTML=table(

students.filter(s=>

/* =========================
   STUDENT TABLE
========================= */

function table(list){

if(!list.length){

return `<div class="empty">
No student records yet. Add your first student.
</div>`;

}


return `

<div class="table-wrap">

<table>

<thead>

<tr>

<th>Student</th>
<th>ID</th>
<th>Department</th>
<th>Year</th>
<th>GPA</th>
<th>Status</th>
<th>Actions</th>

</tr>

</thead>


<tbody>

${list.map(s=>`

<tr>

<td>

<div class="student-cell">

<div class="mini-avatar">
${initials(esc(s.name))}
</div>

${esc(s.name)}

</div>

</td>


<td>${esc(s.sid)}</td>

<td>${esc(s.dept)}</td>

<td>${esc(s.year)}</td>

<td>${s.gpa||'—'}</td>


<td>

<span class="badge

${s.status==='On Leave'?'leave':''}

${s.status==='Graduated'?'graduated':''}

">

${esc(s.status)}

</span>

</td>


<td class="actions-cell">

<button onclick="editStudent('${s.id}')">
Edit
</button>

<button class="delete"
onclick="deleteStudent('${s.id}')">
Delete
</button>

</td>

</tr>

`).join('')}

</tbody>

</table>

</div>

`;

}


/* EDIT */

window.editStudent=id=>{

openModal(
students.find(s=>s.id===id)
);

};


/* DELETE */

window.deleteStudent=id=>{

if(confirm('Delete this student record?')){

students=students.filter(s=>s.id!==id);

save();

render();

}

};


/* ESCAPE HTML */

function esc(value){

return String(value??'').replace(/[&<>"']/g,

character=>({

'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'

}[character])

);

}


/* CSV EXPORT */

window.exportCSV=()=>{

let rows=[

[
'Name',
'Student ID',
'Email',
'Department',
'Year',
'Status',
'Phone',
'GPA'
],

...students.map(s=>[
s.name,
s.sid,
s.email,
s.dept,
s.year,
s.status,
s.phone,
s.gpa
])

];


let csv=rows.map(row=>

row.map(value=>

'"'+String(value??'')
.replace(/"/g,'""')+'"'

).join(',')

).join('\n');


let a=document.createElement('a');

a.href=URL.createObjectURL(
new Blob([csv],{type:'text/csv'})
);

a.download='student-report.csv';

a.click();

URL.revokeObjectURL(a.href);

};


/* START */

auth();

</script>

</body>
</html>
